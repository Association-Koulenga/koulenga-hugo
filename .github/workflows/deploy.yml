# =============================================================================
# deploy.yml — GitHub Pages : build Hugo + QA + déploiement
# Modèle : documentation officielle gohugo.io « Deploy to GitHub Pages »
# (https://gohugo.io/host-and-deploy/deploy-to-github-pages/, consultée le
# 02/11/2026 — actions/checkout@v7, configure-pages@v6,
# upload-pages-artifact@v5, deploy-pages@v5, tarballs épinglés).
# Plan de migration v2 (§9.4, §10.3-A, §10.4) : Hugo extended **0.169.0 épinglé**
# (A23/R17), `--gc --minify --printPathWarnings`,
# **copie de public/fr/404.html → public/404.html** (A6/R12 : GitHub Pages
# attend la 404 à la racine), QA programmatique bloquante (A28), puis
# configure-pages → upload-pages-artifact → deploy-pages.
# =============================================================================
name: Build, QA and deploy to GitHub Pages

# ── Outils épinglés (build reproductible, R17) ──────────────────────────────
env:
  HUGO_VERSION: "0.169.0"      # extended — même version que l'intégration locale
  TZ: "Europe/Paris"

on:
  push:
    branches:
      - master                # branche de publication (§8 : Sveltia CMS → master)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false    # jamais de déploiement interrompu

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history (lastmod/git info si activé)
          lfs: false
          submodules: recursive # thème vendored — init s'il est en submodule

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # Hugo EXTENDED 0.169.0 épinglé — tarball direct,
      # pas de actions/setup-hugo : c'est le modèle de la doc officielle.
      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION} (extended)..."
          curl -sfL --output-dir "${{ runner.temp }}" -O \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf \
            "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Log tool versions
        run: |
          command -v hugo  &> /dev/null && echo "Hugo: $(hugo version)"          || echo "Hugo: not installed"

      - name: Configure Git
        run: git config --global core.quotepath false   # accents des médias : noms lisibles

      - name: Fetch full Git history
        run: |
          if [[ $(git rev-parse --is-shallow-repository) == true ]]; then
            echo "Fetching full Git history..."
            git fetch --unshallow
          fi

      - name: Initialize Git submodules
        run: |
          if [[ -f .gitmodules ]]; then
            echo "Initializing Git submodules..."
            git submodule update --init --recursive
          fi

      - name: Cache restore
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: hugo-${{ github.run_id }}
          restore-keys: hugo-

      # Build production (§10.1) : --gc (images orphelines du cache), --minify,
      # --printPathWarnings (détecte les doublons de chemins du type C1 /fr/fr/),
      # --printI18nWarnings. AUCUN warning toléré : la commande échoue (exit≠0)
      # sur warning de Goldmark ; pas de continue-on-error.
      - name: Build
        run: |
          echo "Building the project..."
          hugo build \
            --gc \
            --minify \
            --printPathWarnings \
            --printI18nWarnings \
            --logLevel info \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      # 404 à la racine GitHub Pages (A6/R12) : defaultContentLanguageInSubdir
      # génère public/fr/404.html — GitHub Pages attend public/404.html.
      - name: Copy root 404
        run: |
          echo "Copying public/fr/404.html -> public/404.html..."
          cp public/fr/404.html public/404.html

      # QA programmatique bloquante (A28/§10.4) : mapping d'URLs §5.1, aliases
      # noindex, render hooks, sitemap/robots/RSS, JSON-LD, médias, menu sans
      # doublon. Exit 1 ⇒ le job échoue ⇒ pas de déploiement.
      - name: Run QA checks
        run: |
          KOULENGA_PUBLIC="${PWD}/public" \
          KOULENGA_QA_RESULTS="${PWD}/qa_results.json" \
          KOULENGA_BASE="${{ steps.pages.outputs.base_url }}" \
            python3 scripts/qa_checks.py

      - name: Cache save
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/.cache/hugo
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          include-hidden-files: false
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
