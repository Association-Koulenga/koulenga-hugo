# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# =============================================================================
# Sveltia CMS — configuration du back-office du site Hugo Koulenga
# Source : plan de migration v2 (02/11/2026), §8 + annexe D.
#
# ⚠️ CE FICHIER EST PUBLIC (servi sur https://dev.koulenga.com/admin/config.yml) :
#    AUCUN SECRET ICI. Les secrets (Client Secret GitHub) vivent UNIQUEMENT
#    en variables chiffrées du Worker Cloudflare — cf. README-SVELTIA.md et
#    §8.4 du plan.
#
# URL publique du Worker Cloudflare « Sveltia CMS Authenticator » :
# https://sveltia-cms-auth.koulenga.workers.dev
#
# NOTE : les ancres YAML (&ancre / *ancre) ne sont pas supportées nativement
#        par Sveltia (§8.6/annexe D) — les blocs `fields` sont ici dupliqués
#        intégralement, volontairement.
# =============================================================================

# ── Backend GitHub ─────────────────────────────────────────────────────────
backend:
  name: github
  repo: Association-Koulenga/koulenga-hugo   # dépôt du site Hugo, branche master
  branch: master
  # Worker Cloudflare « Sveltia CMS Authenticator » (§8.3).
  base_url: https://sveltia-cms-auth.koulenga.workers.dev
  # Dépôt PUBLIC → scope minimal (§8.3). Dépôt privé → retirer (scope repo par défaut).
  auth_scope: public_repo
  # Non-techniciens : connexion OAuth uniquement, pas de jetons personnels (§8.7) :
  auth_methods: [oauth]

site_url: https://dev.koulenga.com

# ── Médias ────────────────────────────────────────────────────────────────
# Dossier global (bibliothèque d'actifs) pour les fichiers hors pages :
media_folder: static/images
public_folder: /images

media_libraries:
  default:
    config:
      max_file_size: 20971520      # 20 Mo max par upload (§8.6, garde-fou anti-LFS)
      slugify_filename: true       # nouveaux fichiers : ASCII kebab-case (§8.6)
      # Phase d'optimisation (option) — NOUVEAUX uploads uniquement :
      # transformations:
      #   raster_image: { format: webp, quality: 85, width: 2048, height: 2048 }

# ── Workflow éditorial (§8.7) ──────────────────────────────────────────────
publish_mode:
  type: editorial_workflow
  stages: [draft, pending_review]   # Brouillon → En revue → (Publier)
  direct_publish: true               # « Enregistrer et publier » pour les corrections simples
  allow_incomplete_drafts: false    # champs obligatoires exigés

# ── Collections : les 18 pages en 5 file collections (§8.6) ──────────────────
# `media_folder: ''` + `public_folder: ''` PAR FICHIER = médias colocalisés
# dans le page bundle de chaque page (URLs /fr/<page>/<fichier> préservées).
# Champs exposés : title, description, draft, weight, params.media_order,
# aliases (où hérités de Grav), image_align (accueil), body (+ hints PDF).
collections:

  # 1. PAGE D'ACCUEIL (home + actualités) ───────────────────────────────────
  - name: accueil
    label: Page d'accueil
    icon: home
    files:
      - name: home
        label: Accueil — bandeau & bloc photos
        file: content/fr/_index.md
        media_folder: ''            # entry-relative : images dans content/fr/ (§8.6)
        public_folder: ''
        fields:
          - label: Titre
            name: title
            widget: string
            required: true
          - label: Paramètres
            name: params
            widget: object
            fields:
              - label: Texte du bandeau (appel aux dons)
                name: hero_text
                widget: markdown
                required: false
                hint: Texte superposé au bandeau plein écran, avec le lien HelloAsso.
              - label: Images du bandeau (1re = image de fond)
                name: banner_images
                widget: list
                required: false
                summary: '{{fields.image}}'
                fields:
                  - label: Image
                    name: image
                    widget: object
                    fields:
                      - { name: src, widget: image, required: true }
                      - { name: alt, widget: string, required: false, hint: Description pour l'accessibilité }
              - label: Bloc photos « Cross »
                name: photo_images
                widget: list
                required: false
                fields:
                  - label: Image
                    name: image
                    widget: object
                    fields:
                      - { name: src, widget: image, required: true }
                      - { name: alt, widget: string, required: false }
              - label: Alignement du bloc photos
                name: image_align
                widget: select
                options: [left, right, center]
                default: right
                required: false
              - label: Classes d'affichage (ne pas modifier)
                name: body_classes
                widget: string
                default: 'modular header-image fullwidth'
                required: false
      - name: actualites
        label: Accueil — Actualités
        # Page headless en page bundle (aligné sur la structure réelle du dépôt) :
        file: content/fr/sections/news/index.md
        media_folder: ''            # images dans content/fr/sections/news/ (à côté)
        public_folder: ''
        fields:
          - label: Titre
            name: title
            widget: string
            required: true
            default: Actualités
          - label: Date de mise à jour
            name: date
            widget: datetime
            type: date
            required: false
          - label: Contenu
            name: body
            widget: markdown
            required: false
            hint: "Chronologie des actualités (2018 → aujourd'hui). Nouvelle actualité en haut."
      # Option si l'association garde une galerie (§8.6 ligne 5 — à trancher).
      # Aligné sur la structure réelle du dépôt : page headless « Cross »
      # (contenu migré de Grav, non rendue seule — servie comme module de la home).
      # Décommenter pour l'exposer aux éditeurs :
      # - name: photos
      #   label: Accueil — Galerie (Cross)
      #   file: content/fr/sections/photos/index.md
      #   media_folder: ''
      #   public_folder: ''
      #   fields:
      #     - { label: Titre, name: title, widget: string, required: true, default: Cross }
      #     - { label: Date de mise à jour, name: date, widget: datetime, type: date, required: false }
      #     - label: Paramètres
      #       name: params
      #       widget: object
      #       fields:
      #         - { label: Alignement des images, name: image_align, widget: select, options: [left, right, center], default: right, required: false }
      #     - { label: Contenu, name: body, widget: markdown, required: false }

